[project]
name = "altlay"
version = "0.1.0"
description = "Generate text with ChatGPT's private web API via a stealth browser"
authors = [
    { name = "TrueKing", email = "samuellance73@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cloakbrowser>=0.6.0",
]

[project.scripts]
altlay = "altlay:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
